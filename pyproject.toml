[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imzali-depo"
version = "1.0.0"
description = "Ed25519 imzalı yazılım/dosya deposu indeksi üretir ve doğrular (tedarik zinciri bütünlüğü)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Semih Kaba" }]
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
imzali-depo = "imzali_depo.cli:main"

[tool.setuptools]
packages = ["imzali_depo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
